<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b3fd1" />
    <title>Hors ligne · Pointili</title>
    <link rel="icon" href="/icon-192.png" />
    <!--
      Static and dependency-free ON PURPOSE. The service worker serves this when
      there is no network at all, so it cannot fetch a font, a stylesheet or an
      image at the moment it is needed. The logo is a data URI for the same
      reason: referencing /icon-192.png would work only while that file is still
      in the cache, and "the logo is missing" is exactly the failure this screen
      exists to avoid.

      It does not pretend to work offline. Pointili is a live points ledger — a
      cached balance is worse than no balance, because a cashier would credit
      against a number that is no longer true. So it says the honest thing,
      keeps the brand, and gets out of the way the moment the signal returns.
    -->
    <style>
      :root { color-scheme: dark }
      * { box-sizing: border-box }
      html, body { height: 100% }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        background-color: #07030f;
        background-image:
          radial-gradient(95% 42% at 50% -4%, #6a4dd6 0%, transparent 58%),
          linear-gradient(180deg, #3b2a86 0%, #221862 42%, #120c2c 72%, #07030f 100%);
        background-attachment: fixed;
      }
      main { animation: rise .5s cubic-bezier(.2,.9,.3,1) both }
      @keyframes rise {
        from { opacity: 0; transform: translate3d(0, 12px, 0) }
        to   { opacity: 1; transform: none }
      }
      .mark {
        width: 76px; height: 76px; margin: 0 auto 22px;
        border-radius: 22px; overflow: hidden;
        background: #f8f7fc;
        box-shadow: 0 18px 44px -14px rgba(0,0,0,.75);
      }
      .mark img { width: 100%; height: 100%; display: block }
      h1 { margin: 0 0 10px; font-size: 23px; font-weight: 800; letter-spacing: -.02em }
      p { margin: 0 auto; max-width: 30ch; font-size: 14px; line-height: 1.65; color: rgba(255,255,255,.62) }
      button {
        margin-top: 24px; padding: 14px 30px; border: 0;
        border-radius: 999px; background: #7c3aed;
        font: inherit; font-size: 14px; font-weight: 700; color: #fff;
        cursor: pointer; transition: transform .12s;
      }
      button:active { transform: scale(.97) }
      .note { margin-top: 26px; font-size: 12px; color: rgba(255,255,255,.35) }
      /* the live signal, so nobody sits here tapping a button that cannot work */
      .dot {
        display: inline-block; width: 7px; height: 7px; margin-right: 6px;
        border-radius: 50%; background: #ff8a8a; vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) {
        main, .dot { animation: none }
      }
    </style>
  </head>

      </div>
      <h1>Pas de connexion</h1>
      <p>
        Tes points sont en sécurité — ils sont enregistrés chez Pointili, pas sur
        ton téléphone. Reconnecte-toi et tout sera là.
      </p>
      <button type="button" id="retry"><span class="dot" id="dot"></span>Réessayer</button>
      <p class="note">pointili.online</p>
    </main>
    <script>
      /*
        Inline, because an external script is one more thing that cannot load.
        Two jobs: retry on demand, and retry BY ITSELF the moment the phone has
        signal again — somebody who walks back into wifi should not have to
        discover that this screen has a button on it.
      */
      var retry = document.getElementById("retry");
      var dot = document.getElementById("dot");
      function go() { location.replace("/"); }
      retry.addEventListener("click", go);
      window.addEventListener("online", go);
      function paint() {
        var on = navigator.onLine;
        dot.style.background = on ? "#7ff0b0" : "#ff8a8a";
        retry.lastChild.textContent = on ? "Recharger" : "Réessayer";
      }
      window.addEventListener("online", paint);
      window.addEventListener("offline", paint);
      paint();
    </script>
  </body>
